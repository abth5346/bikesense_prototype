<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeSense BLE Prototype</title>

    <style>
        :root {
            --background: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
            --blue: #2563eb;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .status {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }

        .status.connected {
            border-color: var(--green);
        }

        .status.error {
            border-color: var(--red);
        }

        button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #connectButton {
            background: var(--blue);
            color: white;
        }

        #connectButton:hover {
            background: #1d4ed8;
        }

        #disconnectButton {
            background: #374151;
            color: white;
            display: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
        }

        .card-title {
            color: var(--muted);
            font-size: 15px;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
        }

        .unit {
            color: var(--muted);
            margin-top: 5px;
        }

        .log-container {
            margin-top: 30px;
        }

        .log-title {
            color: var(--muted);
            margin-bottom: 8px;
        }

        #log {
            background: #030712;
            border-radius: 10px;
            padding: 15px;
            min-height: 160px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚲 BikeSense</h1>

    <div class="subtitle">
        BLE Cycling Speed & Cadence Prototype
    </div>

    <div id="status" class="status">
        🔴 Disconnected
    </div>

    <button id="connectButton">
        Connect to Bike
    </button>

    <button id="disconnectButton">
        Disconnect
    </button>

    <div class="dashboard">

        <div class="card">
            <div class="card-title">
                Speed
            </div>

            <div id="speed" class="value">
                --
            </div>

            <div class="unit">
                mph
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Cadence
            </div>

            <div id="cadence" class="value">
                --
            </div>

            <div class="unit">
                RPM
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Wheel Revolutions
            </div>

            <div id="revolutions" class="value">
                --
            </div>

            <div class="unit">
                revolutions
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                BLE Connection
            </div>

            <div id="connection" class="value">
                OFF
            </div>

            <div class="unit">
                Bluetooth
            </div>
        </div>

    </div>


    <div class="log-container">

        <div class="log-title">
            BLE Log
        </div>

        <div id="log">
Waiting for connection...
        </div>

    </div>

</div>


<script>

const CSC_SERVICE_UUID =
    "00001816-0000-1000-8000-00805f9b34fb";

const CSC_MEASUREMENT_UUID =
    "00002a5b-0000-1000-8000-00805f9b34fb";

const WHEEL_CIRCUMFERENCE_M = 2.11;

let device = null;
let server = null;
let measurementCharacteristic = null;

let previousWheelRevolutions = null;
let previousWheelEventTime = null;

let previousCrankRevolutions = null;
let previousCrankEventTime = null;


const statusElement =
    document.getElementById("status");

const connectButton =
    document.getElementById("connectButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const speedElement =
    document.getElementById("speed");

const cadenceElement =
    document.getElementById("cadence");

const revolutionsElement =
    document.getElementById("revolutions");

const connectionElement =
    document.getElementById("connection");

const logElement =
    document.getElementById("log");


function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        "\n[" + time + "] " + message;

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


function setStatus(message, type) {

    statusElement.textContent =
        message;

    statusElement.classList.remove(
        "connected",
        "error"
    );

    if (type) {
        statusElement.classList.add(type);
    }
}


connectButton.addEventListener(
    "click",
    connectToBike
);


disconnectButton.addEventListener(
    "click",
    disconnectBike
);


async function connectToBike() {

    if (!navigator.bluetooth) {

        setStatus(
            "Web Bluetooth is not supported",
            "error"
        );

        log(
            "Web Bluetooth is not available in this browser."
        );

        return;
    }


    try {

        log(
            "Opening Bluetooth device picker..."
        );

        setStatus(
            "Select your bike..."
        );


        device =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    CSC_SERVICE_UUID
                ]

            });


        log(
            "Selected device: " +
            (device.name || "Unnamed device")
        );


        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnect
        );


        setStatus(
            "Connecting..."
        );


        log(
            "Connecting to GATT server..."
        );


        server =
            await device.gatt.connect();


        log(
            "GATT connection successful."
        );


        setStatus(
            "Finding Cycling Speed & Cadence service..."
        );


        const service =
            await server.getPrimaryService(
                CSC_SERVICE_UUID
            );


        log(
            "CSC service found."
        );


        measurementCharacteristic =
            await service.getCharacteristic(
                CSC_MEASUREMENT_UUID
            );


        log(
            "CSC Measurement characteristic found."
        );


        await measurementCharacteristic
            .startNotifications();


        measurementCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleMeasurement
        );


        setStatus(
            "🟢 Connected to " +
            (device.name || "Bike"),
            "connected"
        );


        connectionElement.textContent =
            "ON";


        connectButton.style.display =
            "none";


        disconnectButton.style.display =
            "block";


        log(
            "BLE connection established."
        );


        log(
            "Waiting for measurements..."
        );


    } catch (error) {

        console.error(error);

        log(
            "ERROR: " + error.message
        );

        setStatus(
            "🔴 Connection failed",
            "error"
        );

    }

}


function handleMeasurement(event) {

    const data =
        event.target.value;

    if (data.byteLength < 1) {
        return;
    }


    const flags =
        data.getUint8(0);


    let offset = 1;


    if (flags & 0x01) {

        if (data.byteLength < offset + 6) {
            return;
        }


        const wheelRevolutions =
            data.getUint32(
                offset,
                true
            );

        offset += 4;


        const wheelEventTime =
            data.getUint16(
                offset,
                true
            );

        offset += 2;


        revolutionsElement.textContent =
            wheelRevolutions;


        calculateSpeed(
            wheelRevolutions,
            wheelEventTime
        );

    }


    if (flags & 0x02) {

        if (data.byteLength < offset + 4) {
            return;
        }


        const crankRevolutions =
            data.getUint16(
                offset,
                true
            );

        offset += 2;


        const crankEventTime =
            data.getUint16(
                offset,
                true
            );

        offset += 2;


        calculateCadence(
            crankRevolutions,
            crankEventTime
        );

    }

}


function calculateSpeed(
    currentRevolutions,
    currentEventTime
) {

    if (
        previousWheelRevolutions === null ||
        previousWheelEventTime === null
    ) {

        previousWheelRevolutions =
            currentRevolutions;

        previousWheelEventTime =
            currentEventTime;

        return;
    }


    const revolutionDelta =
        counterDelta(
            currentRevolutions,
            previousWheelRevolutions,
            0x100000000
        );


    const timeTicks =
        counterDelta(
            currentEventTime,
            previousWheelEventTime,
            0x10000
        );


    const timeSeconds =
        timeTicks / 1024;


    if (timeSeconds > 0) {

        const metersPerSecond =
            (
                revolutionDelta *
                WHEEL_CIRCUMFERENCE_M
            ) /
            timeSeconds;


        const mph =
            metersPerSecond * 2.236936;


        speedElement.textContent =
            Math.max(
                0,
                mph
            ).toFixed(1);

    }


    previousWheelRevolutions =
        currentRevolutions;

    previousWheelEventTime =
        currentEventTime;

}


function calculateCadence(
    currentRevolutions,
    currentEventTime
) {

    if (
        previousCrankRevolutions === null ||
        previousCrankEventTime === null
    ) {

        previousCrankRevolutions =
            currentRevolutions;

        previousCrankEventTime =
            currentEventTime;

        return;
    }


    const revolutionDelta =
        counterDelta(
            currentRevolutions,
            previousCrankRevolutions,
            0x10000
        );


    const timeTicks =
        counterDelta(
            currentEventTime,
            previousCrankEventTime,
            0x10000
        );


    const timeSeconds =
        timeTicks / 1024;


    if (timeSeconds > 0) {

        const rpm =
            (
                revolutionDelta /
                timeSeconds
            ) * 60;


        cadenceElement.textContent =
            Math.round(
                Math.max(
                    0,
                    rpm
                )
            );

    }


    previousCrankRevolutions =
        currentRevolutions;

    previousCrankEventTime =
        currentEventTime;

}


function counterDelta(
    current,
    previous,
    modulus
) {

    let delta =
        current - previous;


    if (delta < 0) {
        delta += modulus;
    }


    return delta;
}


function disconnectBike() {

    if (
        device &&
        device.gatt &&
        device.gatt.connected
    ) {

        log(
            "Disconnecting..."
        );

        device.gatt.disconnect();

    } else {

        resetUI();

    }

}


function handleDisconnect() {

    log(
        "BLE device disconnected."
    );

    resetUI();

}


function resetUI() {

    setStatus(
        "🔴 Disconnected"
    );


    connectionElement.textContent =
        "OFF";


    speedElement.textContent =
        "--";


    cadenceElement.textContent =
        "--";


    revolutionsElement.textContent =
        "--";


    connectButton.style.display =
        "block";


    disconnectButton.style.display =
        "none";


    previousWheelRevolutions =
        null;

    previousWheelEventTime =
        null;

    previousCrankRevolutions =
        null;

    previousCrankEventTime =
        null;


    measurementCharacteristic =
        null;

    server =
        null;

}


if (!navigator.bluetooth) {

    log(
        "Warning: Web Bluetooth is not available."
    );

} else {

    log(
        "Web Bluetooth is available."
    );

}

</script>

</body>
</html>
