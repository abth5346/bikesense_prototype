<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Gecko Bike Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .status-banner {
            text-align: center;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            background: #1e293b;
            color: #94a3b8;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .status-banner.connected {
            background: #064e3b;
            color: #34d399;
            border-color: #059669;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            transition: background 0.2s ease;
            margin-bottom: 24px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button.btn-disconnect {
            background: #dc2626;
        }

        button.btn-disconnect:hover {
            background: #b91c1c;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }

        .value {
            font-size: 38px;
            font-weight: 700;
            margin: 8px 0;
            color: #f8fafc;
        }

        .unit {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .console-container {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px;
        }

        .console-title {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .console {
            height: 140px;
            overflow-y: auto;
            font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: #cbd5e1;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚲 Blue Gecko Bike</h1>

    <div id="statusBanner" class="status-banner">Ready to connect</div>

    <button id="toggleBtn">Connect to Bike</button>

    <div class="grid">
        <div class="card">
            <div class="label">Speed</div>
            <div id="speedVal" class="value">--</div>
            <div class="unit">mph</div>
        </div>

        <div class="card">
            <div class="label">Cadence</div>
            <div id="cadenceVal" class="value">--</div>
            <div class="unit">RPM</div>
        </div>

        <div class="card">
            <div class="label">Wheel Revolutions</div>
            <div id="wheelVal" class="value">--</div>
            <div class="unit">Revs</div>
        </div>

        <div class="card">
            <div class="label">BLE Link</div>
            <div id="linkVal" class="value" style="color: #ef4444;">OFF</div>
            <div class="unit">Status</div>
        </div>
    </div>

    <div class="console-container">
        <div class="console-title">Live Radio Logs</div>
        <div id="consoleLog" class="console">Awaiting user action...</div>
    </div>
</div>

<script>
const CSC_SERVICE = 'cycling_speed_and_cadence';
const CSC_CHAR = 'csc_measurement';

let bleDevice = null;
let gattServer = null;
let cscCharacteristic = null;

let prevWheelRevolutions = -1;
let prevWheelTime = -1;
let prevCrankRevolutions = -1;
let prevCrankTime = -1;

const toggleBtn = document.getElementById('toggleBtn');
const statusBanner = document.getElementById('statusBanner');
const speedVal = document.getElementById('speedVal');
const cadenceVal = document.getElementById('cadenceVal');
const wheelVal = document.getElementById('wheelVal');
const linkVal = document.getElementById('linkVal');
const consoleLog = document.getElementById('consoleLog');

function writeLog(text) {
    const time = new Date().toLocaleTimeString();
    consoleLog.textContent += `\n[${time}] ${text}`;
    consoleLog.scrollTop = consoleLog.scrollHeight;
    console.log(`[${time}] ${text}`);
}

toggleBtn.addEventListener('click', async () => {
    if (bleDevice && bleDevice.gatt.connected) {
        writeLog("Disconnecting device session...");
        bleDevice.gatt.disconnect();
        return;
    }

    try {
        writeLog("Opening Web Bluetooth device prompt...");
        statusBanner.textContent = "Scanning for all nearby BLE devices...";

        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                CSC_SERVICE,
                0x1816,
                '00001816-0000-1000-8000-00805f9b34fb'
            ]
        });

        writeLog(`Paired with: ${bleDevice.name || 'Unnamed Peripheral'}`);
        bleDevice.addEventListener('gattserverdisconnected', handleDisconnect);

        statusBanner.textContent = "Connecting to GATT server...";
        gattServer = await bleDevice.gatt.connect();
        writeLog("GATT connection established.");

        writeLog("Locating Cycling Speed & Cadence service...");
        let service;
        try {
            service = await gattServer.getPrimaryService(CSC_SERVICE);
        } catch {
            service = await gattServer.getPrimaryService('00001816-0000-1000-8000-00805f9b34fb');
        }

        writeLog("Locating CSC Measurement characteristic...");
        try {
            cscCharacteristic = await service.getCharacteristic(CSC_CHAR);
        } catch {
            cscCharacteristic = await service.getCharacteristic('00002a5b-0000-1000-8000-00805f9b34fb');
        }

        writeLog("Subscribing to real-time notifications...");
        await cscCharacteristic.startNotifications();
        cscCharacteristic.addEventListener('characteristicvaluechanged', processMeasurement);

        statusBanner.textContent = `Connected to ${bleDevice.name || 'Device'}`;
        statusBanner.classList.add('connected');
        linkVal.textContent = "ON";
        linkVal.style.color = "#34d399";
        toggleBtn.textContent = "Disconnect";
        toggleBtn.classList.add('btn-disconnect');
        writeLog("Pipeline active. Waiting for bike sensor packets...");

    } catch (err) {
        writeLog(`Error: ${err.message}`);
        handleDisconnect();
    }
});

function processMeasurement(event) {
    const data = event.target.value;
    const flags = data.getUint8(0);
    let byteOffset = 1;

    const rawBytes = Array.from(new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
    writeLog(`Packet: [${rawBytes.join(', ')}]`);

    // Flag Bit 0: Wheel Revolution Data Present
    if (flags & 0x01) {
        const cumulativeWheel = data.getUint32(byteOffset, true);
        byteOffset += 4;
        const wheelTime = data.getUint16(byteOffset, true);
        byteOffset += 2;

        wheelVal.textContent = cumulativeWheel;

        if (prevWheelRevolutions !== -1 && wheelTime !== prevWheelTime) {
            const revDiff = cumulativeWheel - prevWheelRevolutions;
            let timeDiffSec = (wheelTime - prevWheelTime) / 1024;
            if (timeDiffSec < 0) timeDiffSec += 64; // Handle 16-bit counter rollover

            const circumferenceMeters = 2.11; // Standard 700x25c wheel size
            const speedMph = ((revDiff * circumferenceMeters) / timeDiffSec) * 2.23694;
            speedVal.textContent = Math.max(0, speedMph).toFixed(1);
        }

        prevWheelRevolutions = cumulativeWheel;
        prevWheelTime = wheelTime;
    }

    // Flag Bit 1: Crank Revolution Data Present
    if (flags & 0x02) {
        const cumulativeCrank = data.getUint16(byteOffset, true);
        byteOffset += 2;
        const crankTime = data.getUint16(byteOffset, true);
        byteOffset += 2;

        if (prevCrankRevolutions !== -1 && crankTime !== prevCrankTime) {
            const crankDiff = cumulativeCrank - prevCrankRevolutions;
            let timeDiffSec = (crankTime - prevCrankTime) / 1024;
            if (timeDiffSec < 0) timeDiffSec += 64; // Handle 16-bit counter rollover

            const rpm = (crankDiff / timeDiffSec) * 60;
            cadenceVal.textContent = Math.round(Math.max(0, rpm));
        }

        prevCrankRevolutions = cumulativeCrank;
        prevCrankTime = crankTime;
    }
}

function handleDisconnect() {
    statusBanner.textContent = "Disconnected";
    statusBanner.classList.remove('connected');
    linkVal.textContent = "OFF";
    linkVal.style.color = "#ef4444";
    toggleBtn.textContent = "Connect to Bike";
    toggleBtn.classList.remove('btn-disconnect');
    speedVal.textContent = "--";
    cadenceVal.textContent = "--";
    wheelVal.textContent = "--";

    prevWheelRevolutions = -1;
    prevWheelTime = -1;
    prevCrankRevolutions = -1;
    prevCrankTime = -1;

    writeLog("BLE connection terminated.");
}
